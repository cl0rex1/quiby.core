# Quiby server defaults.
[balance]
balanceEnabled = false

[hurtProxy]
hurtProxyEnabled = true
hurtProxyMobsTarget = true

[manualDismount]
# Off Balance checks foot contact only; lying on the back must not lock sneak recovery.
manualDismountEnabled = true
dismountMaxTiltDegrees = 180.0
dismountRequireGrounded = false
dismountMaxSpeed = 2.5
dismountMaxSpin = 3.5
dismountHoldTicks = 3
